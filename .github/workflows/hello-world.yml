name: Hello World dogfood

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  hello-world:
    runs-on: ubuntu-latest
    env:
      CACOPHONY_AZURE_ENDPOINT: ${{ vars.CACOPHONY_AZURE_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Hello World review
        id: hello
        uses: jdylanmc/cacophony@84f8b820ca4e4c068a872c31f92844f74e873221
        with:
          prompt-file: .cacophony/agents/hello-world.md
          endpoint: ${{ env.CACOPHONY_AZURE_ENDPOINT }}
          deployment: gpt-5.4-mini
          rate-limit-retries: 2
          fail-on: high
        env:
          CACOPHONY_AZURE_API_KEY: ${{ secrets.CACOPHONY_AZURE_API_KEY }}

      - name: Upload Hello World report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cacophony-hello-world
          path: .cacophony/out/hello-world/
