name: Reusable Repository Audit

on:
  workflow_dispatch:
    inputs:
      agent-filter:
        description: Canonical agent slug to run; leave empty for the full suite
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      agent-filter:
        description: Canonical agent slug to run; leave empty for the full suite
        required: false
        type: string
        default: ""
      max-turns:
        required: false
        type: number
        default: 20
      timeout-seconds:
        required: false
        type: number
        default: 1800
      rate-limit-retries:
        required: false
        type: number
        default: 2
    secrets:
      azure-api-key:
        required: false

permissions:
  contents: read

jobs:
  validate-agent-filter:
    name: Validate agent filter
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - name: Require the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Repository audits may run only against the default branch."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select canonical agents
        id: selection
        env:
          AGENT_FILTER: ${{ inputs.agent-filter }}
        run: node scripts/select-repository-audit-agents.mjs

  audit:
    name: ${{ matrix.name }}
    needs: validate-agent-filter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.validate-agent-filter.outputs.matrix) }}
    env:
      CACOPHONY_AZURE_ENDPOINT: ${{ vars.CACOPHONY_AZURE_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: audit-target
          fetch-depth: 0
          persist-credentials: false

      - name: Run ${{ matrix.name }}
        id: audit
        uses: jdylanmc/cacophony@77bdc064618f813df21f2db6b7c2ae1ab58570f4
        with:
          prompt-file: .cacophony/agents/${{ matrix.agent }}.md
          review-scope: repository
          workspace-directory: audit-target
          endpoint: ${{ env.CACOPHONY_AZURE_ENDPOINT }}
          deployment: ${{ matrix.deployment }}
          max-turns: ${{ inputs.max-turns || 20 }}
          timeout-seconds: ${{ inputs.timeout-seconds || 1800 }}
          rate-limit-retries: ${{ inputs.rate-limit-retries || 2 }}
          fail-on: low
        env:
          CACOPHONY_AZURE_API_KEY: ${{ secrets.azure-api-key || secrets.CACOPHONY_AZURE_API_KEY }}

      - name: Upload ${{ matrix.name }} report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cacophony-repository-audit-${{ matrix.agent }}
          path: audit-target/.cacophony/out/${{ matrix.agent }}/
