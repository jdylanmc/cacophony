name: GLaDOS Documentation Synchronization Review

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  documentation-review:
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: glados-documentation-sentinel
      deployment: gpt-5.4-mini
      max-turns: 20
      timeout-seconds: 600
      rate-limit-retries: 2
      fail-on: high
      event-name: ${{ github.event_name }}
      pull-request-number: ${{ github.event.pull_request.number }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
      author-association: ${{ github.event.pull_request.author_association }}
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}
