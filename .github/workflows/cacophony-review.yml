name: Reusable Cacophony Review

on:
  workflow_call:
    inputs:
      agent-slug:
        required: true
        type: string
      deployment:
        required: true
        type: string
      max-turns:
        required: false
        type: number
        default: 20
      timeout-seconds:
        required: false
        type: number
        default: 600
      rate-limit-retries:
        required: false
        type: number
        default: 2
      fail-on:
        required: false
        type: string
        default: high
      evidence-artifact:
        required: false
        type: string
        default: ""
      evidence-files:
        required: false
        type: string
        default: ""
    secrets:
      azure-api-key:
        required: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      CACOPHONY_AZURE_ENDPOINT: ${{ vars.CACOPHONY_AZURE_ENDPOINT }}
    steps:
      - name: Authorize Azure-backed review
        shell: bash
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request_target" ]]; then
            echo "::error::Trusted Cacophony reviews require a pull_request_target caller."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]; then
            exit 0
          fi

          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "::error::Fork reviews require an owner, member, or collaborator author to authorize Azure quota."
              exit 1
              ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The caller and this workflow are trusted. PR content is inspected
          # only; Cacophony loads prompt-file from the base commit via git show.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Check trusted prompt availability
        id: prompt
        shell: bash
        env:
          AGENT_SLUG: ${{ inputs.agent-slug }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:.cacophony/agents/$AGENT_SLUG.md"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "$AGENT_SLUG starts reviewing after its prompt is merged to the base branch."
          fi

      - name: Prepare evidence directory
        if: inputs.evidence-artifact != ''
        shell: bash
        run: |
          rm -rf .cacophony/evidence
          mkdir -p .cacophony/evidence

      - name: Download declared evidence
        if: inputs.evidence-artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.evidence-artifact }}
          path: .cacophony/evidence

      - name: Run Cacophony review
        id: review
        if: steps.prompt.outputs.ready == 'true'
        uses: jdylanmc/cacophony@410a839794a585f234e43e444881c09533425bcb
        with:
          prompt-file: .cacophony/agents/${{ inputs.agent-slug }}.md
          evidence-files: ${{ inputs.evidence-files }}
          endpoint: ${{ env.CACOPHONY_AZURE_ENDPOINT }}
          deployment: ${{ inputs.deployment }}
          max-turns: ${{ inputs.max-turns }}
          timeout-seconds: ${{ inputs.timeout-seconds }}
          rate-limit-retries: ${{ inputs.rate-limit-retries }}
          fail-on: ${{ inputs.fail-on }}
        env:
          # Trusted-base callers pass only the declared reusable-workflow
          # secret. This worker alone maps it to the action environment.
          CACOPHONY_AZURE_API_KEY: ${{ secrets.azure-api-key }}

      - name: Upload Cacophony report
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cacophony-${{ inputs.agent-slug }}
          path: .cacophony/out/${{ inputs.agent-slug }}/
