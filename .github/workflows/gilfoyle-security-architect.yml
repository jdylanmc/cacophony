name: Gilfoyle the Security Architect

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codeql-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize CodeQL evidence collection
        shell: bash
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]; then
            exit 0
          fi

          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "::error::Fork analysis requires an owner, member, or collaborator author."
              exit 1
              ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        id: codeql
        uses: github/codeql-action/analyze@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          upload: never
          upload-database: false
          output: .cacophony/codeql-results

      - name: Normalize CodeQL evidence
        shell: bash
        env:
          SARIF_DIRECTORY: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          mkdir -p .cacophony/evidence
          mapfile -t sarif_files < <(find "$SARIF_DIRECTORY" -type f -name '*.sarif' -print)
          if [[ "${#sarif_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one CodeQL SARIF file, found ${#sarif_files[@]}."
            exit 1
          fi
          cp "${sarif_files[0]}" .cacophony/evidence/codeql.sarif

      - name: Upload CodeQL evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cacophony-evidence-gilfoyle
          path: .cacophony/evidence/
          if-no-files-found: error

  security-review:
    needs: codeql-evidence
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: gilfoyle-security-architect
      evidence-artifact: cacophony-evidence-gilfoyle
      evidence-files: .cacophony/evidence/codeql.sarif
      deployment: gpt-5.6-sol
      max-turns: 20
      timeout-seconds: 600
      rate-limit-retries: 2
      fail-on: high
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}
