name: Gilfoyle the Security Architect

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  security-review:
    runs-on: ubuntu-latest
    env:
      CACOPHONY_AZURE_ENDPOINT: ${{ vars.CACOPHONY_AZURE_ENDPOINT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gilfoyle security review
        id: gilfoyle
        uses: jdylanmc/cacophony@7f31d99597e908372592dec996720749b476889c
        with:
          prompt-file: .cacophony/agents/gilfoyle-security-architect.md
          endpoint: ${{ env.CACOPHONY_AZURE_ENDPOINT }}
          deployment: gpt-5.6-sol
          max-turns: 16
          timeout-seconds: 600
          rate-limit-retries: 2
          fail-on: high
        env:
          CACOPHONY_AZURE_API_KEY: ${{ secrets.CACOPHONY_AZURE_API_KEY }}

      - name: Upload Gilfoyle report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cacophony-gilfoyle-security-architect
          path: .cacophony/out/gilfoyle-security-architect/
