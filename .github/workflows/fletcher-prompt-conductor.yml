name: Fletcher Prompt Conductor Review

on:
  pull_request_target:
    paths:
      - ".cacophony/agents/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prompt-review:
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: fletcher-prompt-conductor
      deployment: gpt-5.4-mini
      max-turns: 20
      timeout-seconds: 600
      rate-limit-retries: 2
      fail-on: high
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}
