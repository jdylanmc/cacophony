name: Cacophony Hello World
description: Minimal successful action that emits Hello World and a programmer joke.

outputs:
  message:
    description: Hello World sample output.
    value: ${{ steps.sample.outputs.message }}
  joke:
    description: Programmer joke sample output.
    value: ${{ steps.sample.outputs.joke }}

runs:
  using: composite
  steps:
    - name: Report success
      id: sample
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/run.sh"
