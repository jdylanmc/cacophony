name: Cacophony Review
description: Run one adversarial pull request or repository review prompt and produce structured reports.
author: jdylanmc

inputs:
  prompt-file:
    description: Repository-relative Markdown prompt under .cacophony/.
    required: true
  provider:
    description: Agent provider. Only azure-foundry is currently supported.
    required: false
    default: azure-foundry
  review-scope:
    description: Review target. Use pull-request for event-driven review or repository for a full checkout audit.
    required: false
    default: pull-request
  endpoint:
    description: Azure AI Foundry project or OpenAI-compatible endpoint.
    required: true
  deployment:
    description: Azure AI Foundry model deployment name.
    required: true
  max-turns:
    description: Maximum model turns, from 1 through 20.
    required: false
    default: "8"
  timeout-seconds:
    description: Total review deadline, including rate-limit waits, from 30 through 1800 seconds.
    required: false
    default: "300"
  rate-limit-retries:
    description: Retries after the initial HTTP 429 request, from 0 through 10. The default of 2 means two retries after the initial request, for three total attempts, with exponential backoff.
    required: false
    default: "2"
  fail-on:
    description: Minimum finding severity that fails the step, or never.
    required: false
    default: high
  output-directory:
    description: Repository-relative directory for JSON and Markdown reports.
    required: false
    default: .cacophony/out

outputs:
  verdict:
    description: "Terminal output value: pass/warn/fail are findings-derived; inconclusive means no reviewer decision completed, always fails closed, and should be retried when quota is available; error means framework failure."
  max-severity:
    description: Highest finding severity.
  report-json:
    description: Repository-relative path to the JSON report.
  report-markdown:
    description: Repository-relative path to the Markdown report.
  agent-id:
    description: Normalized identifier derived from the prompt filename.

runs:
  using: node24
  main: src/index.js

branding:
  icon: volume-2
  color: purple
